<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lego Batman - PSP</title>
    <!-- Service Worker para liberar SharedArrayBuffer / Multi-threading -->
    <script src="coi-serviceworker.js?v=2"></script>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'psp';
        
        // Link direto do Hugging Face (100% sem proxy)
        EJS_gameUrl = 'https://huggingface.co/datasets/PingolaMurcha/lego-batman-psp/resolve/main/LEGO_Batman_ISO_PSP.iso';
        
        EJS_threads = true;
        EJS_language = 'en-US';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

        // Otimização para rodar suave em PCs fracos
        EJS_config = {
            ppsspp_rendering_mode: 'buffered',
            ppsspp_internal_resolution: '1',
            ppsspp_anisotropic_filtering: '1',
            ppsspp_texture_filtering: '1'
        };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js?v=2"></script>

</body>
</html>
