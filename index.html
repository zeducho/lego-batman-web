<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lego Batman - Web</title>
    <!-- Ativa suporte a SharedArrayBuffer e Threads no PSP -->
    <script src="coi-serviceworker.js"></script>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_gameUrl = 'https://archive.org/download/lego-batman-iso-psp/LEGO_Batman_ISO_PSP.iso';
        EJS_core = 'psp';
        EJS_threads = true;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
